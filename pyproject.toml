[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-price-prediction"
version = "1.0.0"
description = "Production-grade time-series forecasting for the Czech Day-Ahead electricity market (OTE-CR)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lukas W", email = "wendzel42@gmail.com" }
]
license = { text = "MIT" }
keywords = ["energy", "electricity-market", "time-series", "xgboost", "ote-cr", "open-meteo", "forecasting"]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.20",
    "psycopg2-binary>=2.9.9",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "holidays>=0.40",
    "matplotlib>=3.8.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
    "jupyterlab>=4.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
