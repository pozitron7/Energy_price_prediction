name: daily-pipeline

# Mirrors the daily schedule from the design:
#   11:00 UTC  predict tomorrow (weather forecast + model)
#   14:00 UTC  ingest OTE results (published ~13:00 UTC), evaluate, refresh plots
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Predict (11:00 UTC run)
        if: github.event.schedule == '0 11 * * *'
        run: python scripts/run_pipeline.py --mode predict
      - name: Ingest, evaluate, plots (14:00 UTC run)
        if: github.event.schedule != '0 11 * * *'
        run: |
          python scripts/run_pipeline.py --mode ingest --start-date $(date -u -d '-7 days' +%F)
          python scripts/run_pipeline.py --mode transform
          python scripts/run_pipeline.py --mode evaluate
          python scripts/run_pipeline.py --mode plots
